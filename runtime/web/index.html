<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CS2 本地检视控制台</title><link rel="stylesheet" href="/style.css"></head><body>
<header><div class="brand"><span class="mark">Ⅱ</span><div><strong>本地检视控制台</strong></div></div><a href="/help" target="_blank" rel="noopener">使用说明 ↗</a></header>
<main><section class="intro"><div><h1>饰品检视</h1></div><div class="connection"><span>本机连接地址</span><code>connect 127.0.0.1:27015</code><button id="copy" class="secondary">复制连接指令</button></div></section>
<section class="controlbar" aria-label="服务控制"><div><div id="health" class="status">正在连接本地后台…</div><p id="servicehint"></p></div><div class="controlbuttons"><button id="start">启动检视</button><button id="stop" class="secondary danger">停止检视服务</button></div><p id="controlnotice" role="status"></p></section>
<div class="workspace"><section class="library"><div class="section-title"><h2>饰品选择</h2><span id="count"></span></div><nav id="tabs" aria-label="饰品种类"><button data-kind="weapon" class="active">枪械</button><button data-kind="knife">刀具</button><button data-kind="glove">手套</button><button data-kind="presets">我的搭配</button></nav>
<div id="groupcontrols" hidden><label for="outfitgroup">选择组合</label><div class="grouprow"><select id="outfitgroup" aria-label="当前组合"></select><button id="newgroup" class="secondary" type="button">＋ 新建组合</button><button id="deletegroup" class="secondary iconbutton danger" type="button" aria-label="删除组合" title="删除组合">⌫</button></div><button id="applygroup" type="button">应用整组</button><p id="groupnotice" role="status"></p></div><div id="selectors"><label id="categorylabel" for="category">1 · 选择枪械</label><select id="category" aria-label="一级：饰品大类"></select><div class="leveltitle"><label for="search">2 · 选择皮肤</label><span id="groupname"></span></div><input id="search" type="search" placeholder="搜索名称或皮肤编号" aria-label="搜索当前大类皮肤"></div><div id="items" class="items" aria-label="二级：具体皮肤"></div></section>
<section class="editor"><h2 id="selected">正在读取饰品库…</h2><p id="itemmeta" class="muted"></p><div class="visual" id="previewbox"><img id="previewimage" alt="" decoding="async" fetchpriority="high" hidden><span id="monogram">CS2</span><span id="previewstatus" role="status">正在加载图片…</span><button type="button" id="previewretry" class="secondary" hidden>重试图片</button></div>
<form id="form"><div class="pair"><label>图案模板 <small>0–1000</small><input id="seed" type="number" min="0" max="1000" step="1" value="0" required></label><label>磨损值 <small>0–1</small><input id="wear" type="number" min="0" max="1" step="any" value="0.01" required></label></div><input id="wearslider" aria-label="磨损滑块" type="range" min="0" max="1" step="0.0001" value="0.01"><div class="wearlabels"><span>崭新出厂</span><span>战痕累累</span></div>
<div id="weaponextras"><label>名称标签<input id="nametag" maxlength="32" placeholder="可留空"></label><div class="pair"><label class="check"><input id="stattrak" type="checkbox"> StatTrak 计数器</label><label>计数值<input id="stattrakCount" type="number" min="0" max="2147483647" value="0"></label></div></div>
<details id="stickersection"><summary>贴纸搭配 <span>最多 5 张</span></summary><div id="stickerfields"></div><datalist id="stickernames"></datalist></details>
<div class="actions"><button type="submit" id="apply">应用到游戏 →</button><button type="button" id="save" class="secondary">保存搭配</button></div><p id="notice" role="status"></p></form></section></div>
<footer><button id="refresh" class="textbutton">刷新游戏饰品</button></footer></main>
<dialog id="savegroupdialog" aria-labelledby="savegrouptitle"><form id="savegroupform"><h2 id="savegrouptitle">保存搭配</h2><p id="savingitem" class="muted"></p><label for="savegroupselect">保存到</label><select id="savegroupselect" required aria-label="保存到组合"></select><p id="savegrouperror" class="error" role="status"></p><div class="dialogactions"><button type="button" class="secondary" data-close="savegroupdialog">取消</button><button id="confirmsave" type="submit">保存</button></div></form></dialog>
<dialog id="newgroupdialog" aria-labelledby="newgrouptitle"><form id="newgroupform"><h2 id="newgrouptitle">新建组合</h2><label for="newgroupname">组合名称</label><input id="newgroupname" maxlength="32" required placeholder="例如：紫色搭配"><p id="newgrouperror" class="error" role="status"></p><div class="dialogactions"><button type="button" class="secondary" data-close="newgroupdialog">取消</button><button id="confirmnewgroup" type="submit">创建组合</button></div></form></dialog>
<dialog id="deletegroupdialog" aria-labelledby="deletegrouptitle"><h2 id="deletegrouptitle">删除组合？</h2><p id="deletegroupmessage"></p><p id="deletegrouperror" class="error" role="status"></p><div class="dialogactions"><button type="button" class="secondary" data-close="deletegroupdialog">取消</button><button type="button" id="confirmdeletegroup" class="dangerfill">确定删除组合</button></div></dialog>
<script type="module" src="/app.js"></script></body></html>
