<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>打开 CS2 本地检视控制台</title><style>body{margin:0;background:#101314;color:#eaf0ec;font:16px/1.8 "Microsoft YaHei",sans-serif;min-height:100vh;display:grid;place-items:center}main{width:min(560px,85vw);padding:48px 0}small{letter-spacing:2px;color:#dcf179}h1{font-size:32px;line-height:1.4}p{color:#a6b3ab}a{display:block;color:#17200a;background:#dcf179;padding:14px 22px;border-radius:8px;text-align:center;text-decoration:none;font-weight:bold;margin:18px 0}a.secondary{background:transparent;border:1px solid #4b5744;color:#eaf0ec;font-size:14px}code{color:#cad3cc;font-size:13px}.note{font-size:12px}</style></head><body><main><small>COUNTER-STRIKE 2 · LOCAL INSPECT</small><h1>一个入口，<br>启动、配装与检视。</h1><p>点击下面的按钮启动本地后台并打开控制台。服务启动、停止和饰品切换都在控制台中完成。</p><a href="cs2inspect://open">打开本地检视控制台 →</a><a class="secondary" href="http://127.0.0.1:17830/">后台已运行，直接进入</a><p class="note">首次点击时，浏览器可能询问是否打开本地应用，请确认打开。此入口只打开本机控制台。</p><p class="note">如果浏览器未能打开，请双击同目录中的<br><code>打开检视控制台.cmd</code>。</p><p class="note">说明文档：<code>使用说明.md（与此入口同目录）</code></p></main></body></html>
